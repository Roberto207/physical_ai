# Treino no Gazebo (mundo maze), com os MESMOS serviços do robo.yaml. Só muda o mundo.
#
# Use pelo atalho infra/docker/lab.sh sim ..., ou direto:
#   docker compose -f infra/compose/sim.yaml up -d gazebo slam
#
# Por que este arquivo não alcança o robô real, mesmo no PC do laboratório:
# - Rede isolada: os containers ficam numa rede própria do Docker, e não na do PC.
# - Domínio diferente: ROS_DOMAIN_ID=42 (o robô usa 0). Mesmo se um pacote vazasse da rede
#   isolada, o ROS 2 ignora mensagens de outro domínio. São duas barreiras, de propósito.
# - Todo serviço tem "profiles", como no robo.yaml: "up" sem nome não sobe nada.
# Peso: o Gazebo precisa de máquina boa (no notebook do Roberto, NÃO rode: 7,4 GiB).
# Explicação: docs/tarefas/2026-11-16-compose-e-alvos.md
name: tb4-sim

x-ros: &ros
  pull_policy: never
  init: true
  image: physical-ai:sim
  # Memória compartilhada do FastDDS entre os containers (ver robo.yaml). A descoberta continua
  # presa à rede isolada e ao domínio 42, então isto não liga o sim a nada de fora.
  ipc: host
  environment:
    ROS_DOMAIN_ID: "42"
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    DISPLAY: ${DISPLAY:-}
  volumes:
    - ../../workspace:/workspace
    - ../../workspace/mapas:/mapas
    - ../../workspace/logs:/logs
    - /tmp/.X11-unix:/tmp/.X11-unix:ro

services:
  # Gazebo sem janela + o TurtleBot 4 simulado (base, doca, lidar, bateria da Create 3).
  # Comando do manual (tutorials/navigation.html, seção do simulador), com SLAM, localização
  # e Nav2 desligados aqui: cada um é um serviço próprio, igual ao robô real.
  # O nosso sim_headless.launch.py substitui o sim.launch.py oficial para rodar o Gazebo só
  # como servidor (-s --headless-rendering). O Xvfb é a tela falsa onde o lidar renderiza.
  gazebo:
    <<: *ros
    profiles: [mundo]
    mem_limit: ${MEM_GAZEBO:-4g}
    memswap_limit: ${MEM_GAZEBO:-4g}
    volumes:
      - ../../workspace:/workspace
      - ../../workspace/mapas:/mapas
      - ../../workspace/logs:/logs
      - ../docker/sim_headless.launch.py:/opt/ros/jazzy/share/turtlebot4_gz_bringup/launch/sim.launch.py:ro
    command: >-
      bash -c "Xvfb :99 -screen 0 1280x720x24 -nolisten tcp & sleep 2 && export DISPLAY=:99 &&
      source /opt/ros/jazzy/setup.bash &&
      exec ros2 launch turtlebot4_gz_bringup turtlebot4_gz.launch.py world:=maze
      rviz:=false slam:=false localization:=false nav2:=false"

  ferramentas:
    <<: *ros
    profiles: [ferramentas]
    mem_limit: 512m
    memswap_limit: 512m
    command: bash

  # Tira o robô SIMULADO da doca (só existe no sim; no real, o undock é à mão, kit etapa 3).
  undock:
    <<: *ros
    profiles: [manual]
    mem_limit: 256m
    memswap_limit: 256m
    command: >-
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 action send_goal /undock irobot_create_msgs/action/Undock '{}'"

  # Daqui para baixo: os mesmos serviços do robo.yaml, com use_sim_time:=true (relógio do Gazebo).
  slam:
    <<: *ros
    profiles: [mapa]
    mem_limit: 2g
    memswap_limit: 2g
    command: >-
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 launch turtlebot4_navigation slam.launch.py sync:=${SYNC:-true} use_sim_time:=true"

  localizacao:
    <<: *ros
    profiles: [navegacao]
    mem_limit: 1g
    memswap_limit: 1g
    command: >-
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 launch turtlebot4_navigation localization.launch.py use_sim_time:=true
      map:=${MAPA:-/opt/ros/jazzy/share/turtlebot4_navigation/maps/maze.yaml}"

  # No sim, o nav2.yaml oficial (velocidade normal): aqui ninguém se machuca.
  nav2:
    <<: *ros
    profiles: [navegacao]
    mem_limit: 2g
    memswap_limit: 2g
    command: >-
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 launch turtlebot4_navigation nav2.launch.py use_sim_time:=true"

  rviz:
    <<: *ros
    profiles: [tela]
    mem_limit: 1g
    memswap_limit: 1g
    command: >-
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 launch turtlebot4_viz view_navigation.launch.py use_sim_time:=true"

  teleop:
    <<: *ros
    profiles: [manual]
    stdin_open: true
    tty: true
    mem_limit: 256m
    memswap_limit: 256m
    command: >-
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args
      -p stamped:=${STAMPED:-true} -p speed:=${VEL:-0.15} -p turn:=${GIRO:-0.5}"

  # A nossa patrulha no Gazebo = degrau L3 da spec (config gazebo_maze.yaml). Pela spec, o L3
  # vem depois da medição M-GZ: rode só quando o Roberto decidir.
  patrulha:
    <<: *ros
    profiles: [patrulha]
    stdin_open: true
    tty: true
    mem_limit: 512m
    memswap_limit: 512m
    command:
      - bash
      - -c
      - |
        source /opt/ros/jazzy/setup.bash
        CONFIG=${CONFIG:-/workspace/meu_ws/src/patrulha_tb4/config/gazebo_maze.yaml}
        colcon build --base-paths /workspace/meu_ws/src --packages-select patrulha_tb4 \
          --build-base /tmp/build --install-base /tmp/install > /tmp/colcon.log 2>&1 \
          || { cat /tmp/colcon.log; exit 1; }
        source /tmp/install/setup.bash
        validar_pontos "$$CONFIG" || { echo 'Patrulha NÃO iniciada.'; exit 2; }
        exec ros2 launch patrulha_tb4 patrulha.launch.py config:="$$CONFIG" pasta_log:=/logs
