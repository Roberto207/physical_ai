# L1: simulador leve (nav2_loopback_sim) no mapa `maze`, com pontos curtos (TST-03).
#
# Os pontos ficam a 1,5 a 2,5 m um do outro, na área livre em volta da origem do mapa.
# A pose inicial (0, 0) virada para +x é onde o robô nasce encaixado no Gazebo `maze`
# (a doca fica 0,157 m à frente dele). Por isso os mesmos pontos servem ao gazebo_maze.yaml.
# A bateria e a doca aqui são da base falsa (infra/tools/fake_tb4_base.py).
patrulha:
  ambiente: leve
  modelo: standard
  mapa: /opt/ros/jazzy/share/turtlebot4_navigation/maps/maze.yaml
  pose_inicial: {x: 0.0, y: 0.0, yaw_graus: 0}
  aproximacao_doca: {x: -0.6, y: 0.0, yaw_graus: 0}
  pontos:
    - {x: -2.0, y: 0.5, yaw_graus: 90}
    - {x: -2.0, y: 2.5, yaw_graus: 180}
    - {x: -3.5, y: 2.5, yaw_graus: 270}
  bateria:
    modo: absoluto
    alta: 0.95
    baixa: 0.40     # mais alta que o padrão: sobra carga para a volta com a descarga acelerada
    critica: 0.10
  tempos: {espera_bateria_s: 30, confirma_dock_s: 5, cancelar_s: 2, bateria_perdida_s: 10,
           destino_s: 120, servidor_s: 30, encerrar_s: 3}
  limites: {falhas_seguidas: 3, tentativas_dock: 3}
  validacao: {margem_obstaculo_m: 0.25}
