# Ensaio supervisionado: somente os pontos[1] e pontos[2] da patrulha completa.
# O programa repete esses dois pontos até receber o pedido voltar-doca.
# Todas as poses estão no referencial map, em metros e graus.
patrulha:
  ambiente: real
  modelo: standard          # standard | lite (confirmar com o coordenador)

  # O .yaml que o SLAM gravou (etapa 4). Caminho absoluto, ou relativo a este arquivo.
  mapa: mapa_lab_novo.yaml

  # Onde o robô está quando encaixado na doca. Se o SLAM começou com o robô na doca
  # (hipótese H3), fica perto de (0, 0). Conferir no RViz.
  pose_inicial: {x: -0.2025940716266632, y: 0.10048891603946686, yaw_graus: 38.478622669484366}

  # De frente para a doca, a cerca de 0,5 a 1 m dela (a confirmar no laboratório).
  aproximacao_doca: {x: -0.5858250856399536, y: -0.8073815107345581, yaw_graus: 51.28233242603174}

  # Pontos de patrulha, na ordem da ronda. Preencher na etapa 6.
  pontos:
    - {x: -5.608144283294678, y: -0.8229406476020813, yaw_graus: 10}
    - {x: -1.9671252965927124, y: 1.0304899215698242, yaw_graus: 51.28233242603174}
  #  - {x: 1.5, y: 0.0, yaw_graus: 0}

  bateria:
    modo: absoluto          # use `relativo` na etapa 9, para provocar a recarga em minutos
    alta: 0.95
    baixa: 0.20
    critica: 0.10
    delta_alta: 0.005       # só no modo relativo: limite = primeira leitura - delta
    delta_baixa: 0.01       # no robô real, talvez precisem crescer (ruído da leitura)
    delta_critica: 0.02

  tempos:
    # OBRIGATÓRIO no real: pelo menos 3 vezes o maior intervalo entre mensagens de
    # /battery_state medido na etapa 1 (PAT-18). Troque o valor abaixo pelo medido.
    bateria_perdida_s: 30
    espera_bateria_s: 30
    confirma_dock_s: 5
    destino_s: 120          # aumentar se algum trecho for longo com a velocidade reduzida
    servidor_s: 120

  limites: {falhas_seguidas: 1, tentativas_dock: 3}
  validacao: {margem_obstaculo_m: 0.25}
