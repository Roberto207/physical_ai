# ============================================================================================
# CI do repositório: Fase A, o "commit stage" (lint + testes L0 + rastreio da spec).
#
# É informativo: um vermelho aparece no commit e no PR, mas nada bloqueia o merge (a main
# não tem proteção de branch, por decisão do projeto). Explicação completa, com o que cada
# job pega e o que fica para as próximas fases:
#   docs/tarefas/2026-11-18-ci-fase-a.md
#
# Segurança (estudo 02_ci_cd, secrets e supply chain):
#   - permissions: só leitura do código, nenhum secret é usado aqui;
#   - actions fixadas por SHA do commit (a tag @v7 pode ser movida; o SHA não);
#   - ferramentas do pip com versão fixa.
#
# Como ler um vermelho (cada job é um tipo de erro):
#   Marcas de conflito de merge nos arquivos      sobrou <<<<<<< ou >>>>>>> num arquivo
#   Estilo e erros do Python (ruff)               linha longa, import sem uso, nome indefinido
#   Sintaxe do workflow do GitHub Actions         erro neste ci.yml
#   Documentos citando arquivo que não existe     um .md cita um caminho que não existe
#   L0 (humble): a etapa que ficou vermelha       teste da lógica da patrulha falhou
# ============================================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # botão "Run workflow" na aba Actions

permissions:
  contents: read

# Dois pushes seguidos no mesmo branch: cancela a execução antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ verificações
  # Quatro jobs independentes, um por tipo de erro. Cada um roda mesmo que os outros falhem, e o
  # NOME do job vermelho já diz o que quebrou. Antes era um job só ("lint"): o primeiro erro
  # (ex.: uma linha longa no ruff) impedia as etapas seguintes de rodar e escondia os demais.

  # Um merge com conflito resolvido pela metade deixa as marcas do git no arquivo, e o commit
  # passa assim mesmo. Aconteceu no merge f1009a4. Só olha <<<<<<< e >>>>>>>: a linha "=======" sozinha
  # também é sublinhado de título em Markdown.
  conflitos:
    name: Marcas de conflito de merge nos arquivos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Procurar marcas <<<<<<< e >>>>>>>
        run: |
          achou=0
          while IFS=: read -r arquivo linha _; do
            echo "::error file=${arquivo},line=${linha},title=Marca de conflito de merge::Resto de um merge mal resolvido. Resolva o conflito e apague a marca."
            achou=1
          done < <(git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . || true)
          [ "$achou" = 0 ] || exit 1
          echo "Nenhuma marca de conflito."

  # ruff, regras em ruff.toml (E: estilo PEP 8, como linha maior que 100; F: import sem uso,
  # nome indefinido), alvo Python 3.10 = Humble. Cada aviso aparece em cima da linha do arquivo.
  ruff:
    name: Estilo e erros do Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'
      - name: Instalar ruff (versão fixa)
        run: python -m pip install ruff==0.17.3
      - name: ruff check
        run: ruff check --output-format=github .

  # actionlint confere este próprio arquivo: chave errada, expressão ${{ }} inválida, script
  # com erro de shell.
  workflow:
    name: Sintaxe do workflow do GitHub Actions (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'
      - name: Instalar actionlint (versão fixa)
        run: python -m pip install actionlint-py==1.7.12.25
      - name: actionlint
        run: actionlint -color

  # Documento vivo que cita arquivo inexistente (spec enxugamento, P3). Python puro, sem pip.
  caminhos:
    name: Documentos citando arquivo que não existe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Conferir os caminhos citados nos .md
        run: python3 infra/ferramentas/checar_caminhos.py

  # ------------------------------------------------------------------ L0
  # Os testes L0 dentro da imagem oficial do ROS, com o pytest e o PyYAML do apt. Assim o
  # teste usa as MESMAS versões que o robô e o PC têm: humble = Ubuntu 22.04, Python 3.10.
  # Só Humble desde a migração (ADR-001, CI-01). O Jazzy saiu da matriz junto com as imagens;
  # para voltar a testar nele, acrescente "jazzy" à lista abaixo.
  l0:
    name: L0 (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # com mais de uma distro, uma que quebre não interrompe as outras
      matrix:
        distro: [humble]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Instalar pytest e PyYAML do apt
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pytest python3-yaml
          python3 --version
          python3 -m pytest --version
      - name: Testes do patrulha_tb4 (decisão, config, pontos, registro, lint de poses)
        working-directory: workspace/meu_ws/src/patrulha_tb4
        run: python3 -m pytest -ra
      # O teste de rastreio dá "skip" se não achar o DESIGN.md. Aqui ele roda sozinho, para
      # falhar de verdade se algum requisito L0 do DESIGN ficar sem teste (TST-02).
      - name: Rastreio requisito -> teste (TST-02)
        working-directory: workspace/meu_ws/src/patrulha_tb4
        run: python3 test/checar_rastreio.py
      - name: Testes do lab_tb4 (cenários do L1 e conferidor; sem ROS)
        working-directory: workspace/meu_ws/src/lab_tb4
        run: python3 -m pytest -ra
      - name: Testes dos exemplos (decisão da patrulha, validador de ações da LLM)
        working-directory: workspace/exemplos
        run: python3 -m pytest -ra
