# CI: lint e testes da parte pura (sem ROS, sem robô). Informativo: não bloqueia o merge.
# Actions fixadas por SHA (a tag pode ser movida; o SHA não); ferramentas com versão fixa.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: ruff e pytest (Python 3.10, o do Humble)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'
      - run: python -m pip install ruff==0.17.3 pytest==8.3.5
      - run: ruff check --output-format=github .
      - run: python -m pytest -ra tests
