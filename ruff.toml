# Lint do Python do repositório (usado pelo CI em .github/workflows/ci.yml e à mão).
#
#   pip install ruff==0.17.3 && ruff check .      (rodar da raiz do repositório)
#
# Regras mínimas de propósito: E (estilo PEP 8 que vira bug, como linha gigante e nome
# ambíguo) e F (pyflakes: import sem uso, nome indefinido, variável nunca lida).
# Dá para ligar mais famílias depois, uma por vez, quando o código já passar nas atuais.
line-length = 100

# Humble roda no Ubuntu 22.04, com Python 3.10. Com isso o ruff acusa sintaxe que só
# existe em versões mais novas (por exemplo, `except*` do 3.11).
target-version = "py310"

# Código de terceiros copiado sem mudança (ver o ORIGEM.md de cada pasta): não é nosso estilo
# para corrigir, e editar quebraria o "diff -r" contra o upstream.
extend-exclude = ["workspace/meu_ws/src/terceiros"]

[lint]
select = ["E", "F"]
