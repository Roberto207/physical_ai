# Simulação no PC do laboratório: Gazebo (Ignition Fortress, o simulador principal, ADR-002),
# com os MESMOS serviços do robo.yaml. Só muda o mundo.
#
# Use pelo atalho infra/docker/lab.sh sim ..., ou direto:
#   docker compose -f infra/compose/sim.yaml up -d gazebo slam
#
# Por que este arquivo não alcança o robô real, mesmo no PC do laboratório:
# - Rede isolada: os containers ficam numa rede própria do Docker, e não na do PC.
# - Domínio diferente: ROS_DOMAIN_ID=42 (o robô usa 0). Mesmo se um pacote vazasse da rede
#   isolada, o ROS 2 ignora mensagens de outro domínio. São duas barreiras, de propósito.
# - Todo serviço tem "profiles", como no robo.yaml: "up" sem nome não sobe nada.
# - O entrypoint da imagem carrega o ROS da distro dela: nenhum comando aqui escreve a distro.
# Peso: o Gazebo precisa de máquina boa (no notebook do Roberto, NÃO rode: 7,4 GiB).
# Explicação: docs/tarefas/2026-11-16-compose-e-alvos.md e specs/migracao-humble/
name: tb4-sim

x-ros: &ros
  pull_policy: never
  init: true
  image: physical-ai:sim
  # Memória compartilhada do FastDDS entre os containers (ver robo.yaml). A descoberta continua
  # presa à rede isolada e ao domínio 42, então isto não liga o sim a nada de fora.
  ipc: host
  environment:
    ROS_DOMAIN_ID: "42"
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    DISPLAY: ${DISPLAY:-}
  volumes:
    - ../../workspace:/workspace
    - ../../workspace/mapas:/mapas
    - ../../workspace/logs:/logs
    - /tmp/.X11-unix:/tmp/.X11-unix:ro

services:
  # Gazebo sem janela + o TurtleBot 4 simulado (base, doca, lidar, bateria da Create 3), pelo
  # nosso lab_tb4/launch/gazebo.launch.py (servidor -s e --headless-rendering; SIM-01, SIM-01b).
  # O Xvfb é uma tela falsa: fica como garantia para o lidar, caso o --headless-rendering não
  # funcione na GPU do PC (foi o que funcionou no Jazzy em 16/11). MUNDO: maze, depot, warehouse.
  gazebo:
    <<: *ros # herda a imagem, volumes, etc.
    profiles: [mundo] 
    mem_limit: ${MEM_GAZEBO:-4g}
    memswap_limit: ${MEM_GAZEBO:-4g}
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      COMPILAR_WS: lab_tb4
    command: >-
      bash -c "Xvfb :99 -screen 0 1280x720x24 -nolisten tcp & sleep 2 && export DISPLAY=:99 &&
      exec ros2 launch lab_tb4 gazebo.launch.py world:=${MUNDO:-maze}"

  # Simulador leve à mão (o L1 sem roteiro): loopback + Nav2 + base falsa, sem Gazebo
  # (lab_tb4/launch/sim_leve.launch.py, SIM-03). Não rode junto com o gazebo: os dois publicam
  # /tf e /clock. Para os 11 cenários com veredito, use infra/docker/teste_l1.sh.
  leve:
    <<: *ros
    profiles: [leve]
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ${DISPLAY:-}
      COMPILAR_WS: lab_tb4,nav2_loopback_sim
    command:
      - bash
      - -c
      - |
        MAPA='${MAPA:-}'   # vazio = o maze do turtlebot4_navigation
        [ -n "$$MAPA" ] || MAPA="$$(ros2 pkg prefix turtlebot4_navigation)/share/turtlebot4_navigation/maps/maze.yaml"
        exec ros2 launch lab_tb4 sim_leve.launch.py map:="$$MAPA" rviz:=${RVIZ_LEVE:-false}

  ferramentas:
    <<: *ros
    profiles: [ferramentas]
    mem_limit: 512m
    memswap_limit: 512m
    command: bash

  # Tira o robô SIMULADO da doca (só existe no sim; no real, o undock é à mão, kit etapa 3).
  undock:
    <<: *ros
    profiles: [manual]
    mem_limit: 256m
    memswap_limit: 256m
    command: ros2 action send_goal /undock irobot_create_msgs/action/Undock '{}'

  # Daqui para baixo: os mesmos serviços do robo.yaml, com use_sim_time:=true (relógio do Gazebo).
  slam:
    <<: *ros
    profiles: [mapa]
    mem_limit: 2g
    memswap_limit: 2g
    command: >-
      ros2 launch turtlebot4_navigation slam.launch.py sync:=${SYNC:-true} use_sim_time:=true

  # Sem MAPA, o mapa maze que vem no turtlebot4_navigation (o caminho do share é resolvido no
  # container, sem a distro escrita aqui).
  localizacao:
    <<: *ros
    profiles: [navegacao]
    mem_limit: 1g
    memswap_limit: 1g
    command:
      - bash
      - -c
      - |
        MAPA='${MAPA:-}'   # o MAPA do host, posto aqui pelo Compose (vazio = o maze do pacote)
        [ -n "$$MAPA" ] || MAPA="$$(ros2 pkg prefix turtlebot4_navigation)/share/turtlebot4_navigation/maps/maze.yaml"
        test -f "$$MAPA" || { echo "Mapa $$MAPA não existe."; exit 1; }
        exec ros2 launch turtlebot4_navigation localization.launch.py use_sim_time:=true map:="$$MAPA"

  # No sim, o nav2.yaml oficial (velocidade normal): aqui ninguém se machuca.
  nav2:
    <<: *ros
    profiles: [navegacao]
    mem_limit: 2g
    memswap_limit: 2g
    command: ros2 launch turtlebot4_navigation nav2.launch.py use_sim_time:=true

  rviz:
    <<: *ros
    profiles: [tela]
    mem_limit: 1g
    memswap_limit: 1g
    command: ros2 launch turtlebot4_viz view_robot.launch.py use_sim_time:=true

  # A Create 3 simulada do Humble também recebe Twist sem carimbo, como o robô real.
  teleop:
    <<: *ros
    profiles: [manual]
    stdin_open: true
    tty: true
    mem_limit: 256m
    memswap_limit: 256m
    command: >-
      ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args
      -p stamped:=false -p speed:=${VEL:-0.15} -p turn:=${GIRO:-0.5}

  # A nossa patrulha no Gazebo = degrau L3 da spec patrol-inf (config gazebo_maze.yaml).
  patrulha:
    <<: *ros
    profiles: [patrulha]
    stdin_open: true
    tty: true
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ${DISPLAY:-}
      COMPILAR_WS: patrulha_tb4
    command:
      - bash
      - -c
      - |
        CONFIG=${CONFIG:-/workspace/meu_ws/src/patrulha_tb4/config/gazebo_maze.yaml}
        ros2 run patrulha_tb4 validar_pontos "$$CONFIG" || { echo 'Patrulha NÃO iniciada.'; exit 2; }
        exec ros2 launch patrulha_tb4 patrulha.launch.py config:="$$CONFIG" pasta_log:=/logs
