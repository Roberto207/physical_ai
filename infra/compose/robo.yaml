# TurtleBot 4 REAL, a partir do PC do laboratório. Um serviço por tarefa.
#
# Use pelo atalho infra/docker/lab.sh robo ..., que confere a distro das imagens (SEG-01), a
# rede e a memória antes, ou direto:
#   docker compose -f infra/compose/robo.yaml up -d slam
#
# Regras de segurança deste arquivo:
# - Todo serviço tem "profiles": um "docker compose up" sem nome de serviço não sobe NADA.
#   Assim nada mexe no robô por engano; cada serviço é chamado pelo nome (SEG-03).
# - teleop e patrulha movem o robô: só rodam com "docker compose run" (terminal interativo)
#   e pedem que se digite SIM (SEG-04). A patrulha ainda exige o validar_pontos APROVADA (SEG-05).
# - Nenhum serviço faz dock/undock nem mexe na rede ou na configuração do robô (SEG-06).
# - Sem "build:": o Compose nunca constrói imagem sozinho (o build não tem teto de memória).
#   As imagens vêm do infra/docker/construir_imagem.sh.
# - O entrypoint da imagem carrega o ROS da distro dela: nenhum comando aqui escreve a distro.
# Explicação: docs/tarefas/2026-11-16-compose-e-alvos.md e specs/migracao-humble/
#
# O robô é Humble: nós Jazzy na rede dele o derrubaram em 2026-11-16 (falta de memória ao ler
# a mensagem interna ParticipantEntitiesInfo, de formato diferente entre as versões). Por isso
# as imagens são Humble e o lab.sh recusa imagem de outra distro.
#
# O robô do lab (conferido em 2026-11-16, docs/tarefas/2026-11-16-robo-real-rede-e-namespace.md):
# - Roda ROS 2 Humble. O /robot1/cmd_vel dele é geometry_msgs/Twist (sem carimbo), que é o padrão
#   do Humble: o teleop usa stamped:=false e o perfil do Nav2 não tem enable_stamped_cmd_vel.
# - Publica tudo no namespace /robot1 (/robot1/scan, /robot1/tf...). ROBO_NS muda isso; use
#   ROBO_NS= (vazio) para um robô sem namespace. Os launches oficiais aceitam namespace:=
#   (manual: setup/basic.html, "Namespacing").
name: tb4-robo

x-ros: &ros
  pull_policy: never        # a imagem é nossa; nunca procurar no Docker Hub
  init: true                # um init de verdade repassa o Ctrl+C e recolhe processos
  # Rede do PC: o DDS precisa achar o robô no Wi-Fi (o manual não fala de Docker).
  network_mode: host
  # O FastDDS usa memória compartilhada entre processos da mesma máquina. Com ipc separado,
  # dois containers se descobrem mas os dados não passam. host = todos no mesmo /dev/shm.
  ipc: host
  env_file: ../lab/rede_lab.env       # ROS_DOMAIN_ID e RMW iguais aos do robô
  environment:
    DISPLAY: ${DISPLAY:-}
  volumes:
    - ../../workspace:/workspace
    - ../../workspace/mapas:/mapas
    - ../../workspace/logs:/logs
    - /tmp/.X11-unix:/tmp/.X11-unix:ro  # janelas (RViz) na tela do PC
  image: physical-ai:base

services:
  # Terminal ROS para comandos avulsos e para o "lab.sh robo checar-rede".
  ferramentas:
    <<: *ros
    profiles: [ferramentas]
    # No Discovery Server, um nó comum só fica sabendo dos tópicos que ele mesmo usa. O
    # "ros2 topic list" precisa ser super client para ver todos. O configure_discovery.sh
    # oficial liga isto só nos terminais interativos; aqui, só neste serviço de inspeção.
    # Sem ROS_DISCOVERY_SERVER definido (Simple Discovery), a variável não tem efeito.
    environment:
      DISPLAY: ${DISPLAY:-}
      ROS_SUPER_CLIENT: "True"
    mem_limit: 512m
    memswap_limit: 512m
    command: bash

  # Mapa novo. Manual: tutorials/generate_map.html (aba Humble). Só lê o /scan e a odometria e
  # publica o /map: não manda velocidade. sync:=true é o modo que o manual recomenda no PC.
  slam:
    <<: *ros
    profiles: [mapa]
    mem_limit: 2g
    memswap_limit: 2g
    command: >-
      ros2 launch turtlebot4_navigation slam.launch.py sync:=${SYNC:-true}
      namespace:=${ROBO_NS-/robot1}

  # Localização (AMCL) num mapa salvo. Manual: tutorials/navigation.html.
  # MAPA é o caminho DENTRO do container: os mapas de workspace/mapas/ aparecem em /mapas/.
  localizacao:
    <<: *ros
    profiles: [navegacao]
    mem_limit: 1g
    memswap_limit: 1g
    command: >-
      bash -c "test -f ${MAPA:-/mapas/mapa_lab_novo.yaml} || { echo 'Mapa ${MAPA:-/mapas/mapa_lab_novo.yaml} não existe. Defina MAPA=/mapas/<nome>.yaml'; exit 1; } &&
      exec ros2 launch turtlebot4_navigation localization.launch.py map:=${MAPA:-/mapas/mapa_lab_novo.yaml}
      params:=/workspace/meu_ws/src/patrulha_tb4/config/localization_inf.yaml
      namespace:=${ROBO_NS-/robot1}"

  # Nav2 com o nosso perfil de velocidade reduzida (0,15 m/s, INF-02). Manual:
  # tutorials/navigation.html. O perfil é cópia do nav2.yaml oficial do Humble (CFG-04): Twist
  # sem carimbo, como o robô espera, sem precisar de cópia com sed.
  nav2:
    <<: *ros
    profiles: [navegacao]
    mem_limit: 2g
    memswap_limit: 2g
    command: >-
      ros2 launch /workspace/meu_ws/src/patrulha_tb4/launch/nav2_inf.launch.py
      params_file:=${NAV2_PARAMS:-/workspace/meu_ws/src/patrulha_tb4/config/nav2_inf_devagar.yaml}
      namespace:=${ROBO_NS-/robot1}

  # RViz. No Humble, o turtlebot4_viz tem o view_robot.launch.py (não há view_navigation).
  # Manual: tutorials/generate_map.html, aba Humble. Precisa da imagem com RViz.
  rviz:
    <<: *ros
    image: physical-ai:robo
    profiles: [tela]
    mem_limit: 1g
    memswap_limit: 1g
    command: ros2 launch turtlebot4_viz view_robot.launch.py namespace:=${ROBO_NS-/robot1}

  # Dirigir pelo teclado. MOVE O ROBÔ REAL. Manual: tutorials/driving.html.
  # stamped:=false: o robô Humble só aceita Twist sem carimbo (SEG-02). speed/turn são
  # parâmetros do teleop (o padrão dele, 0,5 m/s e 1,0 rad/s, é rápido demais para mapear com
  # gente por perto). __ns põe o "cmd_vel" relativo do teleop dentro do namespace do robô.
  teleop:
    <<: *ros
    profiles: [manual]
    stdin_open: true
    tty: true
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - bash
      - -c
      - |
        echo 'ATENÇÃO: isto move o robô REAL (manual: tutorials/driving.html).'
        echo 'Confirme: pessoa ao lado pronta para parar, área livre, robô FORA da doca.'
        read -r -p 'Digite SIM para continuar: ' resposta
        [ "$$resposta" = SIM ] || { echo 'Cancelado.'; exit 1; }
        echo 'Velocidade inicial ${VEL:-0.15} m/s e ${GIRO:-0.5} rad/s. As teclas q/w/e AUMENTAM 10% por toque.'
        NS='${ROBO_NS-/robot1}'   # vazio: sem o -r (o ROS recusa "__ns:=" vazio)
        exec ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args \
          $${NS:+-r __ns:=$$NS} \
          -p stamped:=false -p speed:=${VEL:-0.15} -p turn:=${GIRO:-0.5}

  # patrulha_tb4 (programa anterior; o atual está em workspace/patrulha_oficial/). MOVE O ROBÔ SOZINHO. Precisa de localizacao e nav2 rodando.
  # CONFIG é o caminho DENTRO do container. O padrão é o modelo vazio, que o validar_pontos
  # recusa de propósito: sem uma configuração preenchida, a patrulha não sai.
  # COMPILAR_WS: o entrypoint compila o patrulha_tb4 em /tmp antes (cerca de 1 s).
  patrulha:
    <<: *ros
    profiles: [patrulha]
    stdin_open: true
    tty: true
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      DISPLAY: ${DISPLAY:-}
      COMPILAR_WS: patrulha_tb4
    command:
      - bash
      - -c
      - |
        CONFIG=${CONFIG:-/workspace/meu_ws/src/patrulha_tb4/config/inf_lab.yaml}
        # Item 1 do protocolo do INF: sem validar_pontos APROVADA, nenhum movimento autônomo.
        ros2 run patrulha_tb4 validar_pontos "$$CONFIG" || { echo 'Patrulha NÃO iniciada.'; exit 2; }
        # O nó publica sozinho a pose_inicial da configuração (é onde a doca fica no mapa).
        echo 'ATENÇÃO: o robô REAL vai andar sozinho. Pessoa ao lado, robô NA doca,'
        echo 'localizacao e nav2 rodando.'
        read -r -p 'Digite SIM para continuar: ' resposta
        [ "$$resposta" = SIM ] || { echo 'Cancelado.'; exit 1; }
        exec ros2 launch patrulha_tb4 patrulha.launch.py config:="$$CONFIG" pasta_log:=/logs \
          namespace:=${ROBO_NS-/robot1}
